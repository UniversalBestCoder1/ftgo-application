test.enabled=false

repositories {
    mavenCentral()
    maven {
        url "https://plugins.gradle.org/m2/"
    }
}

dependencies {
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'com.amazonaws:aws-java-sdk-dynamodb:1.12.600'
    implementation 'commons-lang:commons-lang:2.6'

    implementation 'org.jsonschema2pojo:jsonschema2pojo-core:1.2.1'

    implementation "gradle.plugin.org.hidetake:gradle-swagger-generator-plugin:2.18.2"
}
