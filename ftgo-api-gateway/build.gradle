
apply plugin: "io.spring.dependency-management"

apply plugin: "java"
apply plugin: 'org.springframework.boot'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-contract-dependencies:$springCloudContractDependenciesVersion"
    }
}

configurations.all {
    exclude  module: "spring-boot-starter-web"
}

repositories {
    mavenCentral()
    maven {
        url "${project.rootDir}/build/repo"
    }
}


dependencies {

    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation "org.apache.commons:commons-lang3:3.6"

    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'

    implementation "io.micrometer:micrometer-registry-prometheus:$micrometerVersion"
    implementation "org.springframework.boot:spring-boot-starter-actuator"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "junit:junit:4.12"
    testImplementation "net.chrisrichardson.ftgo:ftgo-order-service-contracts:unspecified:stubs"
    testImplementation "org.springframework.cloud:spring-cloud-contract-wiremock"
    testImplementation "org.springframework.cloud:spring-cloud-starter-contract-stub-runner"

    // FIXME: gradle was downgrading: 5.0.3.RELEASE -> 5.0.0.M6
    // testImplementation "org.springframework.integration:spring-integration-core:5.0.3.RELEASE"

}
